<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technivote - Logowanie</title>

    <script src="js/login.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<nav>
    <h1 id="title">Technivote</h1>
</nav>
    <main>
        <div id="loginForm" class="glass">
            <h2>Logowanie</h2>
            <label class="row">
                <span>Login</span>
                <input type="text" id="login" class="glass">
            </label>
            <label class="row">
                <span>Hasło</span>
                <input type="password" id="pass" class="glass">
            </label>
            <p id="error"></p>
            <button id="submitButton" class="glass btn">Zaloguj się</button>
        </div>
    </main>
</body>
</html>
